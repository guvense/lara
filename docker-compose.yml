services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lara-backend
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8898"
      - --config
      - /data/config.yml
      - --mocks
      - /data/mocks
      - --watcher=true
    volumes:
      - ./runtime:/data
    ports:
      - "8898:8898"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: lara-web
    environment:
      - LARA_BACKEND_URL=http://backend:8898
    depends_on:
      - backend
    ports:
      - "3000:3000"
